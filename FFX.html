<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Fast Top Up - SF</title>
<style>
* {
margin: 0;
padding: 0;
box-sizing: border-box;
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}
​body {
background-color: #0d1117;
color: #ffffff;
padding-bottom: 50px;
}
​/* Header Navigation */
header {
background-color: #161b22;
padding: 15px 20px;
display: flex;
align-items: center;
justify-content: space-between;
border-bottom: 2px solid #2ea043;
box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
}
​.logo-container {
display: flex;
align-items: center;
gap: 12px;
}
​.logo-container img {
width: 45px;
height: 45px;
border-radius: 50%;
border: 2px solid #2ea043;
}
​.logo-container h1 {
font-size: 20px;
color: #2ea043;
font-weight: bold;
}
​/* Main Container */
.container {
max-width: 1100px;
margin: 20px auto;
padding: 0 15px;
}
​/* Banner Slider/Section */
.banner-section {
width: 100%;
margin-bottom: 25px;
border-radius: 12px;
overflow: hidden;
box-shadow: 0 4px 15px rgba(46, 160, 67, 0.2);
border: 1px solid #238636;
}
​.banner-section img {
width: 100%;
display: block;
height: auto;
max-height: 400px;
object-fit: cover;
}
​/* Section Title */
.section-title {
font-size: 22px;
margin-bottom: 15px;
color: #ffffff;
border-left: 4px solid #2ea043;
padding-left: 10px;
}
​/* Products Grid */
.grid-container {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
gap: 20px;
}
​/* Product Card */
.card {
background-color: #161b22;
border-radius: 12px;
border: 1px solid #30363d;
overflow: hidden;
transition: transform 0.3s ease, border-color 0.3s ease;
text-align: center;
display: flex;
flex-direction: column;
justify-content: space-between;
}
​.card:hover {
transform: translateY(-5px);
border-color: #2ea043;
box-shadow: 0 5px 15px rgba(46, 160, 67, 0.3);
}
​.card-img-wrapper {
width: 100%;
height: 180px;
overflow: hidden;
background-color: #0d1117;
}
​.card-img-wrapper img {
width: 100%;
height: 100%;
object-fit: cover;
}
​.card-content {
padding: 15px;
}
​.card-title {
font-size: 18px;
margin-bottom: 10px;
color: #2ea043;
font-weight: 600;
}
​.card-btn {
display: inline-block;
width: 100%;
padding: 10px 0;
background-color: #2ea043;
color: #ffffff;
text-decoration: none;
font-weight: bold;
border-radius: 6px;
margin-top: 10px;
transition: background-color 0.2s;
}
​.card-btn:hover {
background-color: #238636;
}
​/* Footer */
footer {
text-align: center;
margin-top: 40px;
padding: 20px;
color: #8b949e;
font-size: 14px;
border-top: 1px solid #21262d;
}
</style>
</head>
<body>
​<!-- Header / Navbar -->
<header>
<div class="logo-container">
<!-- SF Logo Image -->
<img src="logo.jpg" alt="SF Logo">
<h1>SUPER FAST TOP UP</h1>
</div>
</header>
​<div class="container">
<!-- Main Top Banner -->
<div class="banner-section">
<!-- Main Promotional Banner -->
<img src="Banner 2.jpg" alt="SF Main Banner">
</div>
​<h2 class="section-title">সবগুলো সার্ভিস</h2>
​<!-- Product Cards Grid -->
<div class="grid-container">
​<!-- Item 1: UID Topup BD -->
<div class="card">
<div class="card-img-wrapper">
<img src="UID TOPUP (BD).jpg" alt="UID Topup BD">
</div>
<div class="card-content">
<div class="card-title">UID TOPUP (BD)</div>
<a href="#" class="card-btn">Buy Now</a>
</div>
</div>
​<!-- Item 2: Weekly & Monthly -->
<div class="card">
<div class="card-img-wrapper">
<img src="WEEKLYMONTHLY.jpg" alt="Weekly & Monthly">
</div>
<div class="card-content">
<div class="card-title">WEEKLY & MONTHLY</div>
<a href="#" class="card-btn">Buy Now</a>
</div>
</div>
​<!-- Item 3: Weekly Lite -->
<div class="card">
<div class="card-img-wrapper">
<img src="WEEKLY LITE.jpg" alt="Weekly Lite">
</div>
<div class="card-content">
<div class="card-title">WEEKLY LITE</div>
<a href="#" class="card-btn">Buy Now</a>
</div>
</div>
​<!-- Item 4: Level Up Pass -->
<div class="card">
<div class="card-img-wrapper">
<img src="14702.jpg" alt="Level Up Pass">
</div>
<div class="card-content">
<div class="card-title">LEVEL UP PASS</div>
<a href="#" class="card-btn">Buy Now</a>
</div>
</div>
​<!-- Item 5: FF Likes -->
<div class="card">
<div class="card-img-wrapper">
<img src="14703.jpg" alt="FF Likes Package">
</div>
<div class="card-content">
<div class="card-title">FREE FIRE LIKES</div>
<a href="#" class="card-btn">Buy Now</a>
</div>
</div>
​<!-- Item 6: Indonesia Server -->
<div class="card">
<div class="card-img-wrapper">
<img src="14701.jpg" alt="Indonesia Server">
</div>
<div class="card-content">
<div class="card-title">INDONESIA SERVER</div>
<a href="#" class="card-btn">Buy Now</a>
</div>
</div>
​</div>
​<!-- Secondary Promotional Banner -->
<div class="banner-section" style="margin-top: 30px;">
<img src="Banner 1.jpg" alt="SF Offer Banner">
</div>
</div>
​<footer>
<p>© 2026 Super Fast Top Up (SF). All Rights Reserved.</p>
</footer>
​</body>
</html>
